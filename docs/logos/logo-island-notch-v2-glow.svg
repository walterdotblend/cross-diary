<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Minimalist Island Notch V2 - Neon Pulse & Sync Ripple -->
  <defs>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0A0C12"/>
  
  <!-- Floating Island Notch -->
  <rect x="24" y="22" width="72" height="22" rx="11" fill="#141824" stroke="#252E42" stroke-width="2"/>
  <circle cx="39" cy="33" r="4.5" fill="#FF5500"/>
  <rect x="50" y="30.5" width="22" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="82" cy="33" r="2.5" fill="#00D2FF"/>

  <!-- Sync Ripple Rings -->
  <circle cx="60" cy="78" r="26" stroke="#FF5500" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="60" cy="78" r="18" fill="url(#starGlow)"/>

  <!-- Radiant Diamond Star -->
  <path d="M60 56L66 72L82 78L66 84L60 100L54 84L38 78L54 72Z" fill="url(#neonPulse)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Central Core -->
  <circle cx="60" cy="78" r="3" fill="#FFFFFF"/>
</svg>
